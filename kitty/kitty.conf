# Genuine, unpatched Plex faces. Keep operators literal.
font_family family="IBM Plex Mono" style=Regular
bold_font family="IBM Plex Mono" style=Bold
italic_font family="IBM Plex Mono" style=Italic
bold_italic_font family="IBM Plex Mono" style="Bold Italic"
font_size 16.0
disable_ligatures always

# Kitty padding uses points: 10.5 pt equals 14 logical px at 96 DPI.
window_padding_width 10.5
background_opacity 1.0
# Keep notes/previews readable even when a TUI caches the previous day/night mode.
# Ratio mode repairs lightness while retaining hue, including truecolor purple.
text_fg_override_threshold 9.0 ratio
# SGR faint must not undo the contrast safeguard on reasoning/diff previews.
dim_opacity 1.0
cursor_shape beam
cursor_blink_interval 0
cursor_trail 0
tab_bar_style hidden
enable_audio_bell no

# Keep the normal login shell, clipboard shortcuts and xterm-kitty TERM.
# Inline images work with `kitten icat image.png`, no remote control required.
# For embedded SSH targets without xterm-kitty terminfo, use `kitten ssh host`
# (when supported by the target), or install Kitty's terminfo on that target.
map shift+insert paste_from_clipboard
map ctrl+insert copy_to_clipboard
map shift+enter send_text all \x1b[13;2u
map alt+shift+enter send_text all \x1b[13;4u

# Omarchy swaps this directory and sends SIGUSR1 to reload this include.
include ~/.local/state/omarchy/current/theme/kitty.conf
