<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Preserve explicit font choices. Use unpatched Plex letterforms for text. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>IBM Plex Mono</family></prefer>
  </alias>
  <!-- Icons fall back only when Plex lacks the requested glyph. -->
  <alias binding="strong">
    <family>IBM Plex Mono</family>
    <accept><family>Symbols Nerd Font Mono</family></accept>
  </alias>
</fontconfig>
