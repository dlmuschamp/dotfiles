general {
    lock_cmd = pidof hyprlock || dotfiles-lock
    before_sleep_cmd = pidof hyprlock || dotfiles-lock
    after_sleep_cmd = sleep 1 && dotfiles-wake
    inhibit_sleep = 3
}

# Dim after five minutes. Activity restores the exact saved brightness.
listener {
    timeout = 300
    on-timeout = dotfiles-dim
    on-resume = dotfiles-wake
}

# Lock after fifteen minutes. No screensaver or idle animation is started.
listener {
    timeout = 900
    on-timeout = dotfiles-lock
    on-resume = dotfiles-wake
}
