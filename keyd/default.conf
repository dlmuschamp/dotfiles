# keyd remaps (kernel-level: Hyprland + TTY).
#
# 1) Yoga Copilot → Ctrl
#    Firmware emits LeftShift + LeftMeta + F23 as one chord. GUI shortcut
#    recorders usually show only Super+Shift and drop F23, which is why it
#    "looks like" Super+Shift. Matching the two-key form would also eat real
#    Super+Shift+letter binds (browser, editor, etc.), so keep F23 in the chord.
#
#    Verify with: sudo keyd monitor  (press Copilot; expect the three-key chord)
#    If your hardware truly omits F23, replace the mapping with:
#      leftshift+leftmeta = layer(control)
#
# 2) Physical Win (leftmeta) → momentary nav layer
#    Caps Lock stays Super via hypr/input.lua (caps:super). Win is demoted from
#    a second Super and becomes hold-to-navigate:
#      Win + hjkl              → arrows
#      Caps (Super) + Win + hjkl → Super + arrows (existing Hyprland tiling)
#
#    Caps is still KEY_CAPSLOCK at the keyd layer, so this only remaps the
#    physical Windows key — not Caps-as-Super.

[ids]
*

[main]
leftshift+leftmeta+f23 = layer(control)
leftmeta = layer(nav)

[nav]
h = left
j = down
k = up
l = right
